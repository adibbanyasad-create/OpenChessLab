name: Release Build

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run security
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Pack the application and record integrity checksum
        run: node scripts/package-release.mjs
      - run: sha256sum -c SHA256SUMS.txt
      - name: Verify the archived production installation
        run: |
          mkdir -p "$RUNNER_TEMP/openchesslab-release"
          tar -xzf OpenChessLab-*.tar.gz -C "$RUNNER_TEMP/openchesslab-release"
          npm ci --omit=dev --ignore-scripts --prefix "$RUNNER_TEMP/openchesslab-release/OpenChessLab"
          node scripts/smoke-release.mjs "$RUNNER_TEMP/openchesslab-release/OpenChessLab"
      - name: Create a draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenChessLab-*.tar.gz SHA256SUMS.txt \
            --verify-tag --draft --title "OpenChessLab $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md

  android:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble release APK
        working-directory: android
        env:
          OPENCHESSLAB_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          OPENCHESSLAB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENCHESSLAB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENCHESSLAB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Attach APK to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          NAME="OpenChessLab-${GITHUB_REF_NAME}-android.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          for attempt in 1 2 3 4 5 6; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" "$NAME" "$NAME.sha256" --clobber

  desktop:
    name: Release EXE
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-desktop.mjs
      - name: Smoke-test the executable
        run: node scripts/smoke-desktop.mjs dist/desktop/OpenChessLab.exe 3210
      - name: Attach desktop bundle to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/desktop/* -DestinationPath OpenChessLab-${{ github.ref_name }}-windows.zip -Force
          $hash = (Get-FileHash OpenChessLab-${{ github.ref_name }}-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  OpenChessLab-${{ github.ref_name }}-windows.zip" | Out-File -Encoding ascii "OpenChessLab-${{ github.ref_name }}-windows.zip.sha256"
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            gh release view "${{ github.ref_name }}" 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 20
          }
          gh release upload "${{ github.ref_name }}" "OpenChessLab-${{ github.ref_name }}-windows.zip" "OpenChessLab-${{ github.ref_name }}-windows.zip.sha256" --clobber
