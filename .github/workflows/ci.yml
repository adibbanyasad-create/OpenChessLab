name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR Validation / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run security
      - name: Package and test a clean production installation
        if: matrix.node == 24
        run: |
          node scripts/package-release.mjs
          sha256sum -c SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/openchesslab-package"
          tar -xzf OpenChessLab-*.tar.gz -C "$RUNNER_TEMP/openchesslab-package"
          npm ci --omit=dev --ignore-scripts --prefix "$RUNNER_TEMP/openchesslab-package/OpenChessLab"
          node scripts/smoke-release.mjs "$RUNNER_TEMP/openchesslab-package/OpenChessLab"
      - name: Preserve the verified distribution
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-distribution
          path: |
            OpenChessLab-*.tar.gz
            SHA256SUMS.txt
          retention-days: 7

  browser:
    name: Desktop and Mobile Browser Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7

  container:
    name: Container Runtime Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: docker build -t openchesslab:test .
      - run: docker run --detach --init --name openchesslab-test --memory=2g --cpus=2 -p 127.0.0.1:4180:3001 openchesslab:test
      - run: node scripts/smoke-http.mjs http://127.0.0.1:4180
      - name: Container logs
        if: failure()
        run: docker logs openchesslab-test
      - name: Stop the test container
        if: always()
        run: docker rm --force openchesslab-test || true

  required:
    name: All Checks Passed
    if: always()
    needs: [quality, browser, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$QUALITY_RESULT" = success && test "$BROWSER_RESULT" = success && test "$CONTAINER_RESULT" = success
